{{define "title"}}Cards{{end}}
{{define "content"}}
<hgroup>
  <h1>My cards</h1>
  <p>Cards you assign here can open the door.</p>
</hgroup>

<article>
  <header>Pair a card</header>
  <p>Put the reader into pairing mode, then swipe the card you want to add.</p>
  <div id="pair-area">
    <button hx-post="/htmx/cards/pair" hx-target="#pair-area" hx-swap="innerHTML">
      Pair a card
    </button>
  </div>
</article>

<div id="card-list" hx-get="/htmx/cards" hx-trigger="load">
  <p aria-busy="true">Loading cards…</p>
</div>
{{end}}
