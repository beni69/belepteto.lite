{{define "login"}}<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · beléptető.lite</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <main class="container">
    <article style="max-width: 24rem; margin: 4rem auto;">
      <hgroup>
        <h1>beléptető.lite</h1>
        <p>Log in to continue</p>
      </hgroup>
      <form method="post" action="/login">
        <input type="email" name="email" placeholder="Email" autocomplete="username" required>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        {{if .Error}}<small style="color: var(--pico-del-color);">{{.Error}}</small>{{end}}
        <button type="submit">Log in</button>
      </form>
      {{if .SSOEnabled}}
      <hr>
      <a href="/sso/login" role="button" class="secondary" style="display: block; text-align: center;">{{.SSOButtonText}}</a>
      {{end}}
    </article>
  </main>
</body>
</html>{{end}}
