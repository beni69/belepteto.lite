{{define "login"}}<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · beléptető.lite</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/logo/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/logo/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#13171f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="beléptető.lite">
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="app-shell">
  <main class="container app-main login-main">
    <article class="panel login-panel">
      <picture class="login-brand-mark" aria-hidden="true">
        <source srcset="/static/assets/logo/Logo.png" media="(prefers-reduced-motion: reduce)">
        <img class="brand-logo" src="/static/assets/logo/Logo.gif" alt="">
      </picture>
      <hgroup class="login-heading">
        <h1>beléptető.lite</h1>
        <p>Log in to continue</p>
      </hgroup>
      <form class="form-stack" method="post" action="/login">
        <label>
          Email
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        {{if .Error}}<small class="form-error" role="alert">{{.Error}}</small>{{end}}
        <button type="submit" class="button-with-icon">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 17l5-5-5-5m5 5H3"></path>
            <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path>
          </svg>
          <span>Log in</span>
        </button>
      </form>
      {{if .SSOEnabled}}
      <div class="login-divider"><span>or</span></div>
      <a href="/sso/login" role="button" class="secondary outline button-with-icon sso-button">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"></path>
        </svg>
        <span>{{.SSOButtonText}}</span>
      </a>
      {{end}}
    </article>
  </main>
  <small class="build-version" title="Commit {{.Build.Commit}}">{{.Build.Version}}</small>
</body>
</html>{{end}}
