{{define "pager"}}
<nav class="pager" aria-label="Log pages">
  <ul>
    <li>
      {{if .HasPrev}}
        <button type="button" class="secondary outline button-with-icon" aria-label="Previous page" hx-get="{{.BaseURL}}?{{.PrevQuery}}" hx-target="#{{.TargetID}}" hx-swap="outerHTML">
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"></use></svg><span class="pager-label">Previous</span>
        </button>
      {{else}}
        <button type="button" class="secondary outline button-with-icon" aria-label="Previous page" disabled>
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"></use></svg><span class="pager-label">Previous</span>
        </button>
      {{end}}
    </li>
    <li><span class="pager-count">Page {{.Page}} of {{.TotalPages}}</span></li>
    <li>
      {{if .HasNext}}
        <button type="button" class="secondary outline button-with-icon" aria-label="Next page" hx-get="{{.BaseURL}}?{{.NextQuery}}" hx-target="#{{.TargetID}}" hx-swap="outerHTML">
          <span class="pager-label">Next</span><svg class="icon" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>
        </button>
      {{else}}
        <button type="button" class="secondary outline button-with-icon" aria-label="Next page" disabled>
          <span class="pager-label">Next</span><svg class="icon" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>
        </button>
      {{end}}
    </li>
  </ul>
</nav>
{{end}}
