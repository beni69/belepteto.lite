{{define "pair-status"}}
<div id="pair-area" class="pair-area">
  {{if eq .State "waiting"}}
    <div class="pair-wait" hx-get="/htmx/cards/pair/status" hx-target="#pair-area" hx-swap="outerHTML"
         hx-trigger="every 1s" aria-live="polite">
      <p class="loading-state" aria-busy="true"><svg class="icon" aria-hidden="true"><use href="#icon-clock"></use></svg>{{.Message}}</p>
    </div>
  {{else if eq .State "paired"}}
    <p class="status-message status-success" role="status"><svg class="icon" aria-hidden="true"><use href="#icon-check-circle"></use></svg>{{.Message}}</p>
    <button type="button" class="secondary outline button-with-icon" hx-get="/htmx/cards/pair/status" hx-target="#pair-area" hx-swap="outerHTML">
      <svg class="icon" aria-hidden="true"><use href="#icon-card-plus"></use></svg><span>Pair another</span>
    </button>
    <div hx-get="/htmx/cards" hx-target="#card-list" hx-swap="outerHTML" hx-trigger="load"></div>
  {{else if eq .State "busy"}}
    <p class="status-message status-error" role="alert"><svg class="icon" aria-hidden="true"><use href="#icon-x-circle"></use></svg>{{.Message}}</p>
    <button type="button" class="button-with-icon" hx-post="/htmx/cards/pair" hx-target="#pair-area" hx-swap="outerHTML">
      <svg class="icon" aria-hidden="true"><use href="#icon-card-plus"></use></svg><span>Try again</span>
    </button>
  {{else if eq .State "idle"}}
    <button type="button" class="button-with-icon" hx-post="/htmx/cards/pair" hx-target="#pair-area" hx-swap="outerHTML">
      <svg class="icon" aria-hidden="true"><use href="#icon-card-plus"></use></svg><span>Pair a card</span>
    </button>
  {{else}}
    {{/* timeout, duplicate, error */}}
    <p class="status-message status-error" role="alert"><svg class="icon" aria-hidden="true"><use href="#icon-x-circle"></use></svg>{{.Message}}</p>
    <button type="button" class="button-with-icon" hx-post="/htmx/cards/pair" hx-target="#pair-area" hx-swap="outerHTML">
      <svg class="icon" aria-hidden="true"><use href="#icon-card-plus"></use></svg><span>Try again</span>
    </button>
  {{end}}
</div>
{{end}}
