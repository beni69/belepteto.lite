{{define "card-list"}}
<div id="card-list">
  {{if .Error}}<p style="color: var(--pico-del-color);">{{.Error}}</p>{{end}}
  {{if .Cards}}
  <table>
    <thead>
      <tr><th>Card UID</th><th>Label</th><th></th></tr>
    </thead>
    <tbody>
      {{range .Cards}}
      <tr>
        <td><code>{{.CardUID}}</code></td>
        <td>
          <form hx-post="/htmx/cards/{{.ID}}/relabel" hx-target="#card-list" hx-swap="outerHTML">
            <input type="text" name="label" value="{{.Label}}" placeholder="Label"
                   aria-label="Label for card {{.CardUID}}"
                   hx-trigger="change">
          </form>
        </td>
        <td>
          <button class="secondary outline"
                  hx-delete="/htmx/cards/{{.ID}}"
                  hx-target="#card-list"
                  hx-swap="outerHTML"
                  hx-confirm="Remove this card?">Remove</button>
        </td>
      </tr>
      {{end}}
    </tbody>
  </table>
  {{else}}
  <p>No cards yet. Add one above.</p>
  {{end}}
</div>
{{end}}
