{{define "card-list"}}
<section id="card-list" class="panel card-list-panel">
  <header class="panel-header">
    <span class="panel-header-icon"><svg class="icon" aria-hidden="true"><use href="#icon-card"></use></svg></span>
    <h2>Your cards</h2>
  </header>
  {{if .Error}}<p class="notice-error" role="alert">{{.Error}}</p>{{end}}
  {{if .Cards}}
    <ul class="card-row-list">
      {{range .Cards}}
        <li class="card-row">
          <div class="card-identity">
            <span class="record-icon"><svg class="icon" aria-hidden="true"><use href="#icon-card"></use></svg></span>
            <div class="card-identity-copy">
              <span class="record-eyebrow">Card UID prefix</span>
              <code>{{.CardUIDPrefix}}</code>
            </div>
          </div>
          <form class="card-label-form" hx-post="/htmx/cards/{{.ID}}/relabel" hx-target="#card-list" hx-swap="outerHTML">
            <label class="visually-hidden" for="card-label-{{.ID}}">Label for card {{.CardUIDPrefix}}</label>
            <input id="card-label-{{.ID}}" type="text" name="label" value="{{.Label}}" placeholder="Add a label"
                   aria-label="Label for card {{.CardUIDPrefix}}"
                   hx-trigger="change">
          </form>
          <button type="button" class="secondary outline button-danger button-with-icon button-compact"
                  hx-delete="/htmx/cards/{{.ID}}"
                  hx-target="#card-list"
                  hx-swap="outerHTML"
                  hx-confirm="Remove this card?">
            <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg><span>Remove</span>
          </button>
        </li>
      {{end}}
    </ul>
  {{else}}
    <p class="empty-state"><svg class="icon" aria-hidden="true"><use href="#icon-card"></use></svg>No cards yet. Add one above.</p>
  {{end}}
</section>
{{end}}
