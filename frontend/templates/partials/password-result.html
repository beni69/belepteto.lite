{{define "password-result"}}
{{if .Error}}
<p class="status-message status-error" role="alert"><svg class="icon" aria-hidden="true"><use href="#icon-x-circle"></use></svg>{{.Error}}</p>
{{else if .Success}}
<p class="status-message status-success" role="status"><svg class="icon" aria-hidden="true"><use href="#icon-check-circle"></use></svg>{{.Success}}</p>
{{end}}
{{end}}
