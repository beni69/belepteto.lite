{{define "base"}}<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{template "title" .}} · beléptető.lite</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/logo/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/logo/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#13171f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="beléptető.lite">
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/door-open.js" defer></script>
  <script src="/static/local-time.js" defer></script>
</head>
<body class="app-shell">
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="icon-door" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 21h16M6 21V5a2 2 0 0 1 1.6-2l8-1.6A2 2 0 0 1 18 3.36V21"></path>
      <path d="M14 12h.01"></path>
    </symbol>
    <symbol id="icon-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="4.5" width="19" height="15" rx="2"></rect>
      <path d="M2.5 9.5h19M6.5 15h4"></path>
    </symbol>
    <symbol id="icon-card-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="4" width="17" height="14" rx="2"></rect>
      <path d="M2.5 8.5h17M6 13h4M18.5 14v7M15 17.5h7"></path>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="3.5"></circle>
      <path d="M4.5 21v-1.5a7.5 7.5 0 0 1 15 0V21"></path>
    </symbol>
    <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 21v-1.5a6.5 6.5 0 0 0-13 0V21"></path>
      <circle cx="9.5" cy="7.5" r="3.5"></circle>
      <path d="M17 4.5a3.5 3.5 0 0 1 0 6.8M20.5 21v-1.5a6 6 0 0 0-4.3-5.7"></path>
    </symbol>
    <symbol id="icon-user-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="7.5" r="3.5"></circle>
      <path d="M2.5 21v-1.5a6.5 6.5 0 0 1 13 0V21M19 8v7M15.5 11.5h7"></path>
    </symbol>
    <symbol id="icon-user-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="7.5" r="3.5"></circle>
      <path d="M2.5 21v-1.5a6.5 6.5 0 0 1 13 0V21M17 11.5h6"></path>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"></path>
      <path d="m9 12 2 2 4-4"></path>
    </symbol>
    <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="m8 12 2.5 2.5L16 9"></path>
    </symbol>
    <symbol id="icon-x-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="m9 9 6 6m0-6-6 6"></path>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 7v5l3.5 2"></path>
    </symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2"></rect>
      <path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"></path>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18M8 6V4h8v2m3 0-.8 14H5.8L5 6m4 4v6m6-6v6"></path>
    </symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 17l5-5-5-5m5 5H3"></path>
      <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path>
    </symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 18-6-6 6-6M9 12h12"></path>
    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 18 6-6-6-6m6 6H3"></path>
    </symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h16l-6.5 7.5v5l-3 1.5v-6.5L4 5Z"></path>
    </symbol>
  </svg>

  <nav class="container site-nav" aria-label="Primary navigation">
    <ul class="site-nav-brand">
      <li>
        <a class="brand-link" href="/">
          <span class="brand-mark">
            <picture class="brand-logo-picture">
              <source srcset="/static/assets/logo/Logo.png" media="(prefers-reduced-motion: reduce)">
              <img class="brand-logo" src="/static/assets/logo/Logo.gif" alt="">
            </picture>
          </span>
          <strong>beléptető.lite</strong>
        </a>
      </li>
    </ul>
    <ul class="site-nav-links">
      <li><a class="nav-link" href="/"><svg class="icon" aria-hidden="true"><use href="#icon-card"></use></svg><span>Cards</span></a></li>
      {{if .IsAdmin}}<li><a class="nav-link" href="/admin"><svg class="icon" aria-hidden="true"><use href="#icon-users"></use></svg><span>Admin</span></a></li>{{end}}
      <li class="nav-logout">
        <form method="post" action="/logout">
          <button type="submit" class="secondary outline button-with-icon"><svg class="icon" aria-hidden="true"><use href="#icon-logout"></use></svg><span>Log out</span></button>
        </form>
      </li>
    </ul>
  </nav>
  <main class="container app-main">
    {{template "content" .}}
  </main>
  {{template "door-open-control" .}}
  <small class="build-version" title="Commit {{.Build.Commit}}">{{.Build.Version}}</small>
</body>
</html>{{end}}
